[project]
name = "swimtech"
version = "0.1.0"
description = "Swim technique analysis pipeline and API (freestyle v1)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyarrow>=15",
    "opencv-python-headless>=4.9",
    "pydantic>=2.6",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Heavy model dependencies. Installed only when a stage needs them:
#   uv sync --extra models
models = [
    "onnxruntime>=1.17",
    "torch>=2.2",
    "rfdetr>=1.0",
]

[project.scripts]
swimtech = "swimtech.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["swimtech", "api"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.ruff.lint.flake8-bugbear]
# Frozen config dataclasses and Typer's declarative params are immutable defaults.
extend-immutable-calls = [
    "typer.Argument",
    "typer.Option",
    "swimtech.quality.QualityThresholds",
    "swimtech.smooth.SmoothConfig",
    "swimtech.detect.DetectConfig",
    "swimtech.track.TrackConfig",
    "swimtech.pose.PoseConfig",
    "swimtech.cycles.CycleConfig",
    "swimtech.findings.FindingThresholds",
]

[tool.ruff.lint.per-file-ignores]
"swimtech/calib.py" = ["N806"]  # H is the conventional name for a homography

[tool.pytest.ini_options]
testpaths = ["tests"]
